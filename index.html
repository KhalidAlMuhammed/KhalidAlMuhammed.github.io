<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Khalid Al Muhammed</title>
  <meta name="description" content="Khalid Al Muhammed. The calm before the storm." />
  <meta name="theme-color" content="#ffffff" />

  <!-- Open Graph -->
  <meta property="og:title" content="Khalid Al Muhammed" />
  <meta property="og:description" content="Something is being built. Quietly. For now." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23ff5a1f'/%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --hair: rgba(0, 0, 0, 0.08);
      --orange: #ff5a1f;
      --orange-soft: rgba(255, 90, 31, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* The storm, gathering. A slow warm glow that breathes behind everything. */
    .storm {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(60% 55% at 50% 118%, var(--orange-soft) 0%, transparent 70%);
      animation: breathe 9s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; transform: translateY(0) scale(1); }
      50%      { opacity: 1;    transform: translateY(-1.5%) scale(1.06); }
    }

    .stage {
      position: relative;
      z-index: 1;
      height: 100svh;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6vmin 7vw;
      gap: clamp(18px, 3.2vh, 34px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      font-size: clamp(11px, 1.4vw, 13px);
      font-weight: 600;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
      animation: rise 1s cubic-bezier(.2,.7,.2,1) both;
    }

    h1 {
      font-size: clamp(56px, 15.5vw, 240px);
      line-height: 0.92;
      letter-spacing: -0.045em;
      font-weight: 700;
      max-width: 14ch;
      animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 0.06s both;
    }

    h1 .before { font-weight: 600; }
    h1 .storm-word {
      color: var(--orange);
      font-style: italic;
      letter-spacing: -0.05em;
    }

    .sub {
      font-size: clamp(16px, 2.3vw, 22px);
      line-height: 1.45;
      color: var(--muted);
      max-width: 30ch;
      animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 0.16s both;
    }

    .sub b { color: var(--ink); font-weight: 600; }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4em;
      font-size: clamp(12px, 1.5vw, 14px);
      color: var(--muted);
      animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 0.3s both;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .footer a:hover { color: var(--orange); }

    .footer .dot { opacity: 0.4; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .storm, .eyebrow, h1, .sub, .footer { animation: none; }
    }
  </style>
</head>

<body>
  <div class="storm" aria-hidden="true"></div>

  <main class="stage">
    <span class="eyebrow">Khalid Al Muhammed</span>

    <h1><span class="storm-word">Soon.</span></h1>

    <p class="sub">You'll <b>know</b>.</p>
  </main>

  <footer class="footer">
    <a href="mailto:khalid.almuhammed@columbia.edu">Say hi</a>
    <span class="dot">·</span>
    <a href="https://www.linkedin.com/in/khalid-mahmoud-almohammed/" target="_blank" rel="noopener">LinkedIn</a>
  </footer>
</body>

</html>
